spring:
  application:
    name: ai-knowledge-base-assistant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledge_base}
    username: ${DB_USERNAME:knowledge}
    password: ${DB_PASSWORD:knowledge}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen3:4b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    vectorstore:
      pgvector:
        # Flyway owns the schema; Spring AI must not auto-create its tables.
        initialize-schema: false
        # Validate the Flyway-created vector_store table (columns + dimensions)
        # at startup instead of trusting the migration blindly.
        schema-validation: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${EMBEDDING_DIMENSIONS:1024}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  ingestion:
    storage-directory: ${DOCUMENT_STORAGE_DIR:./data/documents}
    chunk-size: ${INGESTION_CHUNK_SIZE:2000}
    chunk-overlap: ${INGESTION_CHUNK_OVERLAP:200}
  ai:
    request-timeout: ${AI_REQUEST_TIMEOUT:120s}
    embedding-dimensions: ${EMBEDDING_DIMENSIONS:1024}
  retrieval:
    top-k: ${RETRIEVAL_TOP_K:5}
    min-similarity: ${RETRIEVAL_MIN_SIMILARITY:0.75}

logging:
  level:
    root: INFO
    com.stefanzalan.ai_knowledge_base_assistant: DEBUG
    org.springframework.ai: INFO
